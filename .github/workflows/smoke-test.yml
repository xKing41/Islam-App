# Testet eine bereits gebaute APK (aus einem früheren Lauf) im Android-Emulator.
# Start über "Run workflow" mit der Run-ID des APK-Baus.
name: Start-Test (vorhandene APK)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run-ID des APK-Baus
        required: true

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: islam-app-apk*
          merge-multiple: true
          path: apk
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: App im Emulator starten
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/smoke-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: start-test-ergebnis
          path: smoke/
          retention-days: 14
