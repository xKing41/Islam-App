# Veröffentlicht ein Erkennungsmodell für „Rezitation prüfen“: Hugging Face -> ggml (whisper.cpp v1.9.3)
# -> q8_0 -> Release. Die App lädt es von dort (mit Prüfsumme). Auswahl siehe Workflow „Modellvergleich“.
name: Modell veröffentlichen

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Hugging-Face-Modell
        required: true
      base:
        description: Zugrunde liegendes OpenAI-Whisper-Modell (für Tokenizer-Dateien)
        required: true
      slug:
        description: Kurzname (Dateiname ggml-<slug>-q8_0.bin)
        required: true
      tag:
        description: Release-Tag
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Umwandeln
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers huggingface_hub safetensors numpy
          git clone --depth 1 --branch v1.9.3 https://github.com/ggml-org/whisper.cpp
          git clone --depth 1 https://github.com/openai/whisper openai-whisper
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF
          cmake --build whisper.cpp/build -j 4 --target whisper-quantize
          python scripts/model/prepare_model.py "${{ inputs.repo }}" "${{ inputs.base }}" hf
          mkdir -p conv out
          python whisper.cpp/models/convert-h5-to-ggml.py hf openai-whisper conv
          whisper.cpp/build/bin/whisper-quantize conv/ggml-model.bin "out/ggml-${{ inputs.slug }}-q8_0.bin" q8_0
          cd out && sha256sum *.bin | tee SHA256SUMS.txt && ls -l
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Erkennungsmodell für „Rezitation prüfen“ (${{ inputs.tag }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            out/ggml-${{ inputs.slug }}-q8_0.bin
            out/SHA256SUMS.txt
          body: |
            Erkennungsmodell für die Funktion „Rezitation prüfen“ der Islam App.
            Grundlage: ${{ inputs.repo }} (Hugging Face), umgewandelt mit whisper.cpp v1.9.3 (MIT), quantisiert (q8_0).
            Die App lädt das Modell beim ersten Benutzen automatisch herunter und prüft die SHA-256-Summe.
