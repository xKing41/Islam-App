# Misst „Rezitation prüfen“ an echten Rezitationen (EveryAyah):
#  - Falschalarme: korrekt rezitierte Verse, bei denen die App trotzdem etwas markiert
#  - Erkennungsrate: Mutashabihat – Aufnahme eines Verses, geprüft gegen den Text eines sehr ähnlichen Verses
# Erkannt wird mit genau dem whisper.cpp, das die App über whisper.rn nutzt, und dem Modell der App.
# Ergebnis: Bericht in der Zusammenfassung des Laufs und als Datei am Release „rezitation-auswertung“.
name: Auswertung Rezitation prüfen

on:
  workflow_dispatch:
    inputs:
      reciters:
        description: EveryAyah-Rezitatoren (JSON-Liste)
        default: '["Husary_128kbps","Alafasy_128kbps","Minshawy_Murattal_128kbps"]'
      variants:
        description: Suchverfahren (JSON-Liste)
        default: '["greedy","beam5"]'

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        reciter: ${{ fromJSON(inputs.reciters) }}
        variant: ${{ fromJSON(inputs.variants) }}
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Werkzeuge
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          npm ci --no-audit --no-fund
          scripts/recite-eval/build-rtool.sh rtool
          curl -sfL -o model.bin https://github.com/${{ github.repository }}/releases/download/modell-quran-v2/ggml-quran-base-q8_0.bin
          echo "72194195f7d280adebec57acf2c6e01e209484322ec1cec21c275a3c0b1e3d77  model.bin" | sha256sum -c
      - name: Erkennen
        run: |
          npx tsx scripts/recite-eval/transcribe.ts --rtool ./rtool --model model.bin --work work \
            --reciters ${{ matrix.reciter }} --variants ${{ matrix.variant }} --threads 4 --shard ${{ matrix.shard }}/2
          cp work/transcripts.json transcripts-${{ matrix.reciter }}-${{ matrix.variant }}-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: transcripts-${{ matrix.reciter }}-${{ matrix.variant }}-${{ matrix.shard }}
          path: transcripts-*.json

  score:
    needs: transcribe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: transcripts-*
          merge-multiple: true
          path: parts
      - name: Zusammenführen und bewerten
        run: |
          node -e "
            const fs = require('fs');
            const all = {};
            for (const f of fs.readdirSync('parts')) {
              const d = JSON.parse(fs.readFileSync('parts/' + f, 'utf8'));
              for (const [k, v] of Object.entries(d)) {
                const e = (all[k] ??= { segments: [] });
                v.segments.forEach((s, i) => {
                  if (!s) return;
                  const t = (e.segments[i] ??= { ms: s.ms, text: {} });
                  Object.assign(t.text, s.text);
                });
              }
            }
            fs.writeFileSync('transcripts.json', JSON.stringify(all));
            console.log(Object.keys(all).length + ' Aufnahmen');
          "
          npx tsx scripts/recite-eval/score.ts transcripts.json --out eval-report.md --examples 40
          cat eval-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Bericht und Rohdaten ins Protokoll
        run: |
          echo "===== BERICHT ====="
          cat eval-report.md
          echo "===== ROHDATEN (gzip+base64) ====="
          gzip -9 -c transcripts.json | base64 -w 3000 | sed 's/^/ROH:/'
          echo "===== ENDE ====="
      - name: Veröffentlichen
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rezitation-auswertung
          name: Auswertung „Rezitation prüfen“
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            transcripts.json
            eval-report.md
          body: |
            Messung der Funktion „Rezitation prüfen“ an echten Rezitationen (EveryAyah).
            Bericht: eval-report.md · Rohdaten der Erkennung: transcripts.json
