# Wortlaut ausgewählter Azan-Aufnahmen Satz für Satz prüfen (Tonspuren aus dem Release „azan-kandidaten“).
name: Azan-Wortlaut prüfen

on:
  workflow_dispatch:
    inputs:
      ids:
        description: Kennungen aus dem Bericht (Leerzeichen-getrennt)
        required: true

permissions:
  contents: read

jobs:
  phrases:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Satz für Satz erkennen
        env:
          IDS: ${{ inputs.ids }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install --quiet faster-whisper numpy
          mkdir -p flac
          for id in $IDS; do
            curl -sfL -o "flac/$id.flac" "https://github.com/${{ github.repository }}/releases/download/azan-kandidaten/$id.flac"
          done
          ls -la flac
          python scripts/azan/phrases.py flac/*.flac | tee phrases.md
          cat phrases.md >> "$GITHUB_STEP_SUMMARY"
